# ========================================================================
#                              Variables
# ========================================================================
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show
$emoji_picker = rofi -show emoji -emoji-format '{emoji}'  -theme "$HOME"/.config/rofi/emoji.rasi
$browser = /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=librewolf --file-forwarding io.gitlab.librewolf-community
$discord = vesktop --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime
$codium = env FREETYPE_PROPERTIES="cff:no-stem-darkening=1 autofitter:no-stem-darkening=1" codium --enable-features=UseOzonePlatform,WaylandWindowDecorations --ozone-platform=wayland
#$spotify = spotify --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime --uri=%U
$steam = gamescope-session
$clipboardmgr = ~/.config/scripts/clipboard.sh
$workspace_switch = ~/.config/scripts/workspace_switch.sh
$screenrec = ~/.config/scripts/screenrec.sh
$mainMod = SUPER



# ========================================================================
#                             Media keys
# ========================================================================
bind = ,XF86AudioMute, exec, ~/.config/scripts/volume_manager.sh mute
binde = ,XF86AudioLowerVolume, exec, ~/.config/scripts/volume_manager.sh down
binde = ,XF86AudioRaiseVolume, exec, ~/.config/scripts/volume_manager.sh up
bind = ,XF86AudioMicMute, exec, ~/.config/scripts/volume_manager.sh mic-mute

binde = ,XF86MonBrightnessDown, exec, ~/.config/scripts/brightness_manager.sh down
binde = ,XF86MonBrightnessUp, exec, ~/.config/scripts/brightness_manager.sh up

bind = , Print, exec, pidof slurp || hyprshot --freeze -m active --mode output -o ~/Pictures/Screenshots
bind = $mainMod + Shift, S, exec, pidof slurp || hyprshot --freeze -m region -o ~/Pictures/Screenshots
bind = Alt, Print, exec, hyprpicker -a -r
bind = Ctrl + Shift + Alt, R, exec, $screenrec
bind = Shift, F12, exec, $screenrec



# ========================================================================
#                             App Binds
# ========================================================================
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod + Shift, C, exec, ! pidof librewolf || pkill -15 librewolf
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, $discord
bind = Alt + Shift, S, exec, $steam
bind = $mainMod, K, exec, $codium
bind = $mainMod, Period, exec, $emoji_picker


# ========================================================================
#                             Workspaces
# ========================================================================

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod + Shift, 1, movetoworkspace, 1
bind = $mainMod + Shift, 2, movetoworkspace, 2
bind = $mainMod + Shift, 3, movetoworkspace, 3
bind = $mainMod + Shift, 4, movetoworkspace, 4
bind = $mainMod + Shift, 5, movetoworkspace, 5
bind = $mainMod + Shift, 6, movetoworkspace, 6
bind = $mainMod + Shift, 7, movetoworkspace, 7
bind = $mainMod + Shift, 8, movetoworkspace, 8
bind = $mainMod + Shift, 9, movetoworkspace, 9
bind = $mainMod + Shift, 0, movetoworkspace, 10
bind = $mainMod, T, togglespecialworkspace, magic
bind = $mainMod + Alt, T, movetoworkspace, special:magic

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:276, exec, $workspace_switch
bind = $mainMod, mouse:275, workspace, r-1

bind = $mainMod, mouse_down, exec, $workspace_switch
bind = $mainMod, mouse_up, workspace, r-1

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

binde = $mainMod SHIFT, L, resizeactive, 10 0
binde = $mainMod SHIFT, J, resizeactive, -10 0
binde = $mainMod SHIFT, I, resizeactive, 0 -10
binde = $mainMod SHIFT, K, resizeactive, 0 10

bind = $mainMod, F, fullscreen, 1
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev




# ========================================================================
#                              Others
# ========================================================================
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, N, exec, dunstctl history-pop 
bind = $mainMod, M, exec, dunstctl close-all
bind = $mainMod, P, exec, hyprctl reload
bind = $mainMod, V, exec, $clipboardmgr
