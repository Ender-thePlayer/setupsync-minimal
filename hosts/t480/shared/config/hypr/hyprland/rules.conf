# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = size 50% 60%, title:(Open Directory)
windowrulev2 = move 25% 20%, title:(Open Directory)

windowrulev2 = size 50% 60%, title:(Select one or more files to open)
windowrulev2 = move 25% 20%, title:(Select one or more files to open)

windowrulev2 = tile, title:(Synthesizer V Studio Pro - .*)
