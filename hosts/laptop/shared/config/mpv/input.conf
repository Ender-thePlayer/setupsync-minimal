WHEEL_UP      add volume 10
WHEEL_DOWN    add volume -10
WHEEL_LEFT    ignore
WHEEL_RIGHT   ignore
RIGHT      seek   5 exact
LEFT       seek  -5 exact
UP      add volume 10
DOWN       add volume -10

n playlist-next
p playlist-prev
c          cycle sub
f           cycle fullscreen
,      seek   -0.05 exact
.      seek   0.01 exact
